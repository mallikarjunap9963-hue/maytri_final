# Maytri Channel Partner — frontend (Dokploy, separate domains)
# Traefik (Dokploy) routes frontend domain -> this container :80 (static only).
# Browser calls backend directly at its public URL (baked via VITE_API_BASE_URL build arg).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dokploy / Traefik health check (set Health Check Path to /healthz)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Never cache entry point — otherwise stale asset hashes stick
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    # Vite hashed assets — safe to cache immutably for 1 year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback — must be last
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Security headers (applied where possible)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
}
